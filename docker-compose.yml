
services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: banking_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_user
      # Set the default timezone inside the container if you want:
      TZ: Asia/Singapore
    ports:
      - "5432:5432"
    volumes:
      # Persistent data
      - pg_data:/var/lib/postgresql/data
      # Place .sql or .sh files in ./initdb to run on first start
#      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
